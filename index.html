<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 2rem; letter-spacing: 0.1em; }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }
    .setting-group {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    .setting-group label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 0.75rem;
    }
    .setting-group input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1.5rem;
      padding: 0.5rem;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    button {
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      padding: 0.75rem 2rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c1121f; }
    button.reset { background: #333; }
    button.reset:hover { background: #444; }

    .timer-display {
      font-size: 6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }
    .phase {
      font-size: 1.5rem;
      margin: 1rem 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      height: 2rem;
    }
    .phase.round { color: #e63946; }
    .phase.pause { color: #2a9d8f; }

    .progress-bar {
      width: 100%;
      max-width: 600px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      margin-top: 1.5rem;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: #e63946;
      transition: width 0.1s linear;
    }
    .round-counter {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #888;
    }

    @media (max-width: 500px) {
      .settings { grid-template-columns: 1fr; }
      .timer-display { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <h1>⚡ BOX TIMER</h1>

  <div class="settings">
    <div class="setting-group">
      <label>Runde (Sekunden)</label>
      <input type="number" id="roundTime" value="180" min="10" step="10">
    </div>
    <div class="setting-group">
      <label>Pause (Sekunden)</label>
      <input type="number" id="pauseTime" value="60" min="5" step="5">
    </div>
    <div class="setting-group">
      <label>Anzahl Runden</label>
      <input type="number" id="totalRounds" value="12" min="1" step="1">
    </div>
  </div>

  <div class="controls">
    <button onclick="startTimer()">▶ START</button>
    <button onclick="pauseTimer()">⏸ PAUSE</button>
    <button class="reset" onclick="resetTimer()">↺ RESET</button>
  </div>

  <div class="phase" id="phaseLabel">Bereit</div>
  <div class="timer-display" id="timerDisplay">00:00</div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <div class="round-counter" id="roundCounter">Runde 0 / 12</div>

  <script>
    let interval = null;
    let currentRound = 0;
    let isRunning = false;
    let isPaused = false;
    let totalDuration = 0;

    function getSettings() {
      return {
        roundTime: parseInt(document.getElementById('roundTime').value) || 180,
        pauseTime: parseInt(document.getElementById('pauseTime').value) || 60,
        totalRounds: parseInt(document.getElementById('totalRounds').value) || 12
      };
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      const settings = getSettings();
      if (currentRound === 0) currentRound = 1;

      if (!isRunning) {
        totalDuration = settings.roundTime;
        isRunning = true;
        isPaused = false;
      }

      clearInterval(interval);
      let remaining = parseInt(document.getElementById('timerDisplay').innerText.split(':')[0]) * 60
                    + parseInt(document.getElementById('timerDisplay').innerText.split(':')[1]);

      if (remaining <= 0) {
        remaining = settings.roundTime;
        currentRound = Math.min(currentRound, settings.totalRounds);
      }

      updateDisplay(remaining, 'Runde', currentRound, settings.totalRounds, settings.roundTime);

      interval = setInterval(() => {
        remaining--;
        const inPause = currentRound % 2 === 0;
        const phaseDuration = inPause ? settings.pauseTime : settings.roundTime;

        if (remaining <= 0) {
          if (!inPause) {
            currentRound++;
            if (currentRound > settings.totalRounds) {
              clearInterval(interval);
              isRunning = false;
              document.getElementById('phaseLabel').innerText = '✅ FERTIG!';
              document.getElementById('timerDisplay').innerText = '00:00';
              document.getElementById('roundCounter').innerText = `Alle ${settings.totalRounds} Runden geschafft!`;
              return;
            }
            remaining = settings.pauseTime;
            totalDuration = settings.pauseTime;
          } else {
            currentRound++;
            remaining = settings.roundTime;
            totalDuration = settings.roundTime;
          }
        }

        const phaseLabel = (!inPause && remaining === settings.roundTime) || (inPause && remaining === settings.pauseTime)
          ? (inPause ? 'Pause' : 'Runde')
          : (inPause ? 'Pause' : 'Runde');

        updateDisplay(remaining, phaseLabel, Math.min(currentRound, settings.totalRounds), settings.totalRounds, phaseDuration);
      }, 1000);
    }

    function pauseTimer() {
      if (isRunning) {
        clearInterval(interval);
        isPaused = true;
        isRunning = false;
      }
    }

    function resetTimer() {
      clearInterval(interval);
      currentRound = 0;
      isRunning = false;
      isPaused = false;
      const settings = getSettings();
      document.getElementById('timerDisplay').innerText = formatTime(settings.roundTime);
      document.getElementById('phaseLabel').innerText = 'Bereit';
      document.getElementById('phaseLabel').className = 'phase';
      document.getElementById('roundCounter').innerText = `Runde 0 / ${settings.totalRounds}`;
      document.getElementById('progressFill').style.width = '0%';
    }

    function updateDisplay(remaining, phaseLabel, round, totalRounds, phaseDuration) {
      document.getElementById('timerDisplay').innerText = formatTime(remaining);
      const phaseEl = document.getElementById('phaseLabel');
      phaseEl.innerText = `${phaseLabel} ${round} / ${totalRounds}`;
      phaseEl.className = `phase ${round % 2 === 0 ? 'pause' : 'round'}`;
      document.getElementById('roundCounter').innerText = `Runde ${Math.min(round, totalRounds)} / ${totalRounds}`;
      const pct = ((phaseDuration - remaining) / phaseDuration) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    // init display
    resetTimer();
  </script>
</body>
</html>
