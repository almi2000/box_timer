<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e63946">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Box Timer">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Box Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 2rem; letter-spacing: 0.1em; }

    .settings {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 700px;
    }
    .setting-group {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    .setting-group label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.5rem;
    }
    .setting-group input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1.3rem;
      padding: 0.4rem;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    button {
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      padding: 0.75rem 2rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c1121f; }
    button.reset { background: #333; }
    button.reset:hover { background: #444; }

    .timer-display {
      font-size: 6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }
    .phase {
      font-size: 1.5rem;
      margin: 1rem 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      height: 2rem;
    }
    .phase.ready { color: #fca311; }
    .phase.prep { color: #fca311; }
    .phase.round { color: #e63946; }
    .phase.pause { color: #2a9d8f; }
    .phase.done { color: #06d6a0; }

    .progress-bar {
      width: 100%;
      max-width: 600px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      margin-top: 1.5rem;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      transition: width 0.1s linear;
    }
    .fill.round { background: #e63946; }
    .fill.pause { background: #2a9d8f; }
    .fill.prep { background: #fca311; }

    .round-counter {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #888;
    }

    .sound-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #888;
      cursor: pointer;
    }
    .sound-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #e63946;
    }
    .sound-toggle + .sound-toggle {
      margin-top: 0.5rem;
    }

    .flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      z-index: 9999;
      transition: opacity 0.12s ease-out;
    }
    .flash-overlay.active {
      opacity: 0.9;
      transition: none;
    }

    @media (max-width: 600px) {
      .settings { grid-template-columns: repeat(2, 1fr); }
      .timer-display { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <h1>⚡ BOX TIMER</h1>

  <div class="settings">
    <div class="setting-group">
      <label>Vorbereitung (Sek)</label>
      <input type="number" id="prepTime" value="10" min="0" step="5">
    </div>
    <div class="setting-group">
      <label>Runde (Sekunden)</label>
      <input type="number" id="roundTime" value="180" min="10" step="10">
    </div>
    <div class="setting-group">
      <label>Pause (Sekunden)</label>
      <input type="number" id="pauseTime" value="60" min="5" step="5">
    </div>
    <div class="setting-group">
      <label>Anzahl Runden</label>
      <input type="number" id="totalRounds" value="12" min="1" step="1">
    </div>
  </div>

  <div class="controls">
    <button onclick="startTimer()">▶ START</button>
    <button onclick="pauseTimer()">⏸ PAUSE</button>
    <button class="reset" onclick="resetTimer()">↺ RESET</button>
  </div>

  <div class="phase ready" id="phaseLabel">Bereit</div>
  <div class="timer-display" id="timerDisplay">00:00</div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <div class="round-counter" id="roundCounter">Runde 0 / 12</div>

  <label class="sound-toggle">
    <input type="checkbox" id="soundEnabled" checked>
    🔔 Signalton bei Phasenende
  </label>

  <label class="sound-toggle">
    <input type="checkbox" id="randomBeepEnabled">
    🎯 Zufällige Signale in Runden (5-17s)
  </label>

  <label class="sound-toggle">
    <input type="checkbox" id="vibrateEnabled" checked>
    📳 Vibration bei Signalen
  </label>

  <div class="flash-overlay" id="flashOverlay"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/box_timer/sw.js').catch(() => {});
    }
    let interval = null;
    let currentRound = 0;
    let isRunning = false;
    let isPaused = false;
    let currentPhase = 'ready'; // ready, prep, round, pause, done
    let randomBeepTimer = null;

    let audioCtx = null;
    let masterGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Master chain: pushed hard into a brickwall limiter so output stays
        // as loud and consistent as possible on phone speakers without ugly clipping.
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 2.5;
        const limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.value = -3;
        limiter.knee.value = 0;
        limiter.ratio.value = 20;
        limiter.attack.value = 0.001;
        limiter.release.value = 0.05;
        masterGain.connect(limiter);
        limiter.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function soundOn() {
      return document.getElementById('soundEnabled').checked;
    }

    // Screen Wake Lock: hält den Bildschirm an, solange der Timer läuft.
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (err) {
        // z.B. wenn Akku zu niedrig oder nicht erlaubt – kein Grund zum Absturz
      }
    }

    async function releaseWakeLock() {
      if (wakeLock) {
        try { await wakeLock.release(); } catch (err) {}
        wakeLock = null;
      }
    }

    // Der Lock geht verloren, wenn der Tab in den Hintergrund geht (z.B. Benachrichtigung).
    // Sobald die App wieder sichtbar ist und der Timer läuft, neu anfordern.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isRunning) {
        requestWakeLock();
      }
    });

    // Schedule one oscillator note relative to "now", routed through the master limiter.
    function note({ freq, start = 0, dur = 0.15, type = 'square', gain = 0.6, detune = 0 }) {
      const t0 = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      if (detune) osc.detune.value = detune;
      osc.connect(g);
      g.connect(masterGain);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.006); // punchy attack
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    // Bright metallic boxing-bell "ding" (layered partials).
    function bell(offset) {
      note({ freq: 1050, start: offset, dur: 0.5, type: 'square', gain: 0.5 });
      note({ freq: 1580, start: offset, dur: 0.45, type: 'sine', gain: 0.5 });
      note({ freq: 2100, start: offset, dur: 0.35, type: 'sine', gain: 0.35 });
    }

    // Low, harsh klaxon blast.
    function buzzer(offset) {
      note({ freq: 200, start: offset, dur: 0.6, type: 'sawtooth', gain: 0.55 });
      note({ freq: 150, start: offset, dur: 0.6, type: 'square', gain: 0.4 });
      note({ freq: 200, start: offset, dur: 0.6, type: 'sawtooth', gain: 0.4, detune: 10 });
    }

    // navigator.vibrate — makes signals impossible to miss on Android even if muted.
    function vibrate(pattern) {
      if (!document.getElementById('vibrateEnabled').checked) return;
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    // Full-screen colour flash so phase changes are visually obvious too.
    function flash(color, times = 1) {
      const el = document.getElementById('flashOverlay');
      let n = 0;
      (function pulse() {
        el.style.background = color;
        el.classList.add('active');
        setTimeout(() => {
          el.classList.remove('active');
          if (++n < times) setTimeout(pulse, 150);
        }, 150);
      })();
    }

    // Legacy helper kept for compatibility.
    function playBeep(freq, duration) {
      if (!soundOn()) return;
      initAudio();
      note({ freq, dur: duration, type: 'square', gain: 0.6 });
    }

    // Sharp double-blip, mid-high, clearly different from bell/buzzer.
    function playRandomBeep() {
      if (!document.getElementById('randomBeepEnabled').checked) return;
      if (soundOn()) {
        initAudio();
        note({ freq: 1500, start: 0, dur: 0.09, type: 'square', gain: 0.6 });
        note({ freq: 1500, start: 0.13, dur: 0.09, type: 'square', gain: 0.6 });
      }
      vibrate([70, 60, 70]);
      flash('#fca311', 1);
    }

    function scheduleRandomBeep() {
      if (randomBeepTimer) clearTimeout(randomBeepTimer);
      if (!document.getElementById('randomBeepEnabled').checked) return;
      const delay = 5000 + Math.random() * 12000; // 5-17 seconds
      randomBeepTimer = setTimeout(() => {
        playRandomBeep();
        scheduleRandomBeep();
      }, delay);
    }

    function stopRandomBeep() {
      if (randomBeepTimer) {
        clearTimeout(randomBeepTimer);
        randomBeepTimer = null;
      }
    }

    // Round ends → rest: low double klaxon blast + strong long buzz.
    function playRoundEnd() {
      if (soundOn()) { initAudio(); buzzer(0); buzzer(0.75); }
      vibrate([700, 200, 700]);
      flash('#2a9d8f', 2);
    }

    // Pause ends → next round begins: same signal as a fresh round start.
    function playPauseEnd() {
      playStart();
    }

    // Round begins → "box now": triple boxing bell.
    function playStart() {
      if (soundOn()) { initAudio(); bell(0); bell(0.32); bell(0.64); }
      vibrate([450, 150, 450, 150, 450]);
      flash('#e63946', 3);
    }

    // Workout finished: victory fanfare.
    function playDone() {
      if (soundOn()) {
        initAudio();
        bell(0); bell(0.3); bell(0.6);
        note({ freq: 523, start: 1.0, dur: 0.25, type: 'square', gain: 0.5 });
        note({ freq: 659, start: 1.2, dur: 0.25, type: 'square', gain: 0.5 });
        note({ freq: 784, start: 1.4, dur: 0.25, type: 'square', gain: 0.5 });
        note({ freq: 1047, start: 1.6, dur: 0.6, type: 'square', gain: 0.65 });
      }
      vibrate([300, 100, 300, 100, 300, 100, 600]);
      flash('#06d6a0', 4);
    }

    function getSettings() {
      return {
        prepTime: parseInt(document.getElementById('prepTime').value) || 0,
        roundTime: parseInt(document.getElementById('roundTime').value) || 180,
        pauseTime: parseInt(document.getElementById('pauseTime').value) || 60,
        totalRounds: parseInt(document.getElementById('totalRounds').value) || 12
      };
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay(remaining, phase, round, totalRounds, phaseDuration) {
      document.getElementById('timerDisplay').innerText = formatTime(remaining);
      const phaseEl = document.getElementById('phaseLabel');
      const fillEl = document.getElementById('progressFill');

      if (phase === 'prep') {
        phaseEl.innerText = `Vorbereitung ${round} / ${totalRounds}`;
        phaseEl.className = 'phase prep';
        fillEl.className = 'fill prep';
      } else if (phase === 'round') {
        phaseEl.innerText = `Runde ${round} / ${totalRounds}`;
        phaseEl.className = 'phase round';
        fillEl.className = 'fill round';
      } else if (phase === 'pause') {
        phaseEl.innerText = `Pause ${round} / ${totalRounds}`;
        phaseEl.className = 'phase pause';
        fillEl.className = 'fill pause';
      }

      document.getElementById('roundCounter').innerText = `Runde ${round} / ${totalRounds}`;
      const pct = phaseDuration > 0 ? ((phaseDuration - remaining) / phaseDuration) * 100 : 0;
      fillEl.style.width = pct + '%';
    }

    function startTimer() {
      initAudio();
      requestWakeLock();
      const settings = getSettings();

      if (!isRunning && !isPaused) {
        // Fresh start
        if (settings.prepTime > 0) {
          currentPhase = 'prep';
          currentRound = 1;
          startPhase(settings.prepTime, 'prep', settings);
        } else {
          currentPhase = 'round';
          currentRound = 1;
          playStart();
          startPhase(settings.roundTime, 'round', settings);
        }
      } else if (isPaused) {
        // Resume
        isPaused = false;
        isRunning = true;
        resumeTimer(settings);
      }
    }

    function startPhase(duration, phase, settings) {
      clearInterval(interval);
      let remaining = duration;

      updateDisplay(remaining, phase, currentRound, settings.totalRounds, duration);

      interval = setInterval(() => {
        remaining--;

        if (remaining <= 0) {
          if (phase === 'prep') {
            currentPhase = 'round';
            playStart();
            scheduleRandomBeep();
            updateDisplay(settings.roundTime, 'round', currentRound, settings.totalRounds, settings.roundTime);
            remaining = settings.roundTime;
            phase = 'round';
          } else if (phase === 'round') {
            currentRound++;
            if (currentRound > settings.totalRounds) {
              clearInterval(interval);
              isRunning = false;
              currentPhase = 'done';
              releaseWakeLock();
              playDone();
              document.getElementById('phaseLabel').innerText = '✅ FERTIG!';
              document.getElementById('phaseLabel').className = 'phase done';
              document.getElementById('timerDisplay').innerText = '00:00';
              document.getElementById('roundCounter').innerText = `Alle ${settings.totalRounds} Runden geschafft!`;
              document.getElementById('progressFill').style.width = '100%';
              return;
            }
            playRoundEnd();
            stopRandomBeep();
            currentPhase = 'pause';
            updateDisplay(settings.pauseTime, 'pause', currentRound, settings.totalRounds, settings.pauseTime);
            remaining = settings.pauseTime;
            phase = 'pause';
          } else if (phase === 'pause') {
            playPauseEnd();
            currentPhase = 'round';
            updateDisplay(settings.roundTime, 'round', currentRound, settings.totalRounds, settings.roundTime);
            remaining = settings.roundTime;
            phase = 'round';
          }
        } else {
          updateDisplay(remaining, phase, currentRound, settings.totalRounds, phase === 'round' ? settings.roundTime : phase === 'pause' ? settings.pauseTime : settings.prepTime);
        }
      }, 1000);

      isRunning = true;
      isPaused = false;
    }

    function resumeTimer(settings) {
      const phase = currentPhase;
      const display = document.getElementById('timerDisplay').innerText;
      const parts = display.split(':');
      const remaining = parseInt(parts[0]) * 60 + parseInt(parts[1]);

      clearInterval(interval);
      interval = setInterval(() => {
        let currentRemaining = parseInt(document.getElementById('timerDisplay').innerText.split(':')[0]) * 60
                             + parseInt(document.getElementById('timerDisplay').innerText.split(':')[1]);
        currentRemaining--;

        if (currentRemaining <= 0) {
          if (phase === 'prep') {
            currentPhase = 'round';
            playStart();
            scheduleRandomBeep();
            currentRound = 1;
            updateDisplay(settings.roundTime, 'round', currentRound, settings.totalRounds, settings.roundTime);
            currentRemaining = settings.roundTime;
          } else if (phase === 'round') {
            currentRound++;
            if (currentRound > settings.totalRounds) {
              clearInterval(interval);
              isRunning = false;
              currentPhase = 'done';
              releaseWakeLock();
              playDone();
              document.getElementById('phaseLabel').innerText = '✅ FERTIG!';
              document.getElementById('phaseLabel').className = 'phase done';
              document.getElementById('timerDisplay').innerText = '00:00';
              document.getElementById('roundCounter').innerText = `Alle ${settings.totalRounds} Runden geschafft!`;
              document.getElementById('progressFill').style.width = '100%';
              return;
            }
            playRoundEnd();
            stopRandomBeep();
            currentPhase = 'pause';
            updateDisplay(settings.pauseTime, 'pause', currentRound, settings.totalRounds, settings.pauseTime);
            currentRemaining = settings.pauseTime;
          } else if (phase === 'pause') {
            playPauseEnd();
            currentPhase = 'round';
            scheduleRandomBeep();
            updateDisplay(settings.roundTime, 'round', currentRound, settings.totalRounds, settings.roundTime);
            currentRemaining = settings.roundTime;
          }
        } else {
          updateDisplay(currentRemaining, phase, currentRound, settings.totalRounds,
            phase === 'round' ? settings.roundTime : phase === 'pause' ? settings.pauseTime : settings.prepTime);
        }
      }, 1000);
    }

    function pauseTimer() {
      stopRandomBeep();
      if (isRunning) {
        clearInterval(interval);
        isPaused = true;
        isRunning = false;
        releaseWakeLock();
      }
    }

    function resetTimer() {
      stopRandomBeep();
      releaseWakeLock();
      clearInterval(interval);
      currentRound = 0;
      isRunning = false;
      isPaused = false;
      currentPhase = 'ready';
      const settings = getSettings();
      document.getElementById('timerDisplay').innerText = formatTime(settings.prepTime > 0 ? settings.prepTime : settings.roundTime);
      document.getElementById('phaseLabel').innerText = 'Bereit';
      document.getElementById('phaseLabel').className = 'phase ready';
      document.getElementById('roundCounter').innerText = `Runde 0 / ${settings.totalRounds}`;
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressFill').className = 'fill';
    }

    // init
    resetTimer();
  </script>
</body>
</html>
